name: 70b_scratch
init: random
profile: 70b
gpu_type_id: NVIDIA H200
gpu_count: 8
zero_stage: 3
lr: 8.0e-5
smoke_steps: 10
max_steps: 200
micro_batch_size: 1
grad_accum: 8
max_tokens: 1000000
context_length: 200000
cpu_offload: true
notes: >
  From-scratch 70B, random init, 8x H200 SXM ZeRO-3, 200,000 context with
  CPU offload of params and Adam states plus activation checkpointing.
  That is slow on purpose. Token budget is 1M preferred or less (2.5M
  hard cap). Systems smoke, not a talking model. Need a high-RAM node
  (host DRAM, not the 300GB volume — Adam states are hundreds of GB).
  No Hugging Face base weights. Launch with DeepSpeed, not single-process
  python.
