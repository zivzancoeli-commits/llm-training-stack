[project]
name = "lmm-training-stack"
version = "0.1.0"
description = "Test-first scaffold for cost-efficient LLM pretraining from a 100M proxy to a 200B long-context run."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
lmm = "fine_tune.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "model", "infra", "specs", "fine_tune", "pretrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "shape: tensor shape contracts across attention boundaries",
    "init: layer initialization standard-deviation contracts",
    "oom: mocked allocation / memory-threshold contracts",
]
